<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540">
  <!-- ASCEND logo: orange rounded square, white A-fused-with-barbell mark.
       Hand-authored vector (slop-audit WS4) replacing the old 118 KB
       SVG-wrapped PNG. Geometry measured from the owner's approved
       logo (ascend-logo-orange-icon-transparent.png): legs and plates
       are rotated slabs at the same ~30-degree tilt, bar across the A. -->
  <rect width="540" height="540" rx="126" fill="#FF6B1F"/>
  <g fill="#FFFFFF">
    <!-- A legs (apex 270,103; counter apex 270,183) -->
    <path d="M270 103 L155 300 L202 300 L270 183 Z"/>
    <path d="M270 103 L385 300 L338 300 L270 183 Z"/>
    <!-- Barbell bar across the A: an arc band (annulus sector, centre
         270,594, radii 303/262) peaking at y=291 in the middle, with
         plain ends running under the legs/plates -->
    <path d="M190 302 A303 303 0 0 1 350 302 L350 344 A262 262 0 0 0 190 344 Z"/>
    <path d="M150 302 H190 V344 H150 Z"/>
    <path d="M350 302 H390 V344 H350 Z"/>
    <!-- Inner plates (leg slabs below the bar) -->
    <path d="M101 272 L135 253 L219 397 L185 416 Z"/>
    <path d="M439 272 L405 253 L321 397 L355 416 Z"/>
    <!-- Outer plates -->
    <path d="M68 324 L102 305 L156 396 L122 415 Z"/>
    <path d="M472 324 L438 305 L384 396 L418 415 Z"/>
  </g>
</svg>
